services:
  postgres:
    image: postgres:16-alpine
    container_name: flagship-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flagship}
      POSTGRES_USER: ${POSTGRES_USER:-flagship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flagship}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flagship} -d ${POSTGRES_DB:-flagship}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flagship-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the API inside Docker with: docker compose --profile full up --build
  backend:
    profiles: ["full"]
    build: ./backend
    container_name: flagship-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flagship}
      DB_USER: ${POSTGRES_USER:-flagship}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-flagship}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional monitoring: docker compose --profile monitoring up -d
  # Prometheus: http://localhost:9090   Grafana: http://localhost:3000 (admin / admin)
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    container_name: flagship-prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.1
    container_name: flagship-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  grafana-data:
  postgres-data:
