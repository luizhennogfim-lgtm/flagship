name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, tests, quality)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 1. Does it compile? (also runs the Java/Maven version check)
      - name: 1. Compile
        run: mvn -B -ntp -DskipTests compile

      # 2. Fast tests, no Docker needed
      - name: 2. Unit tests
        run: mvn -B -ntp test

      # 3 + 4. Integration tests (Testcontainers starts PostgreSQL and Redis on the runner)
      #        and the quality gate (JaCoCo minimum coverage). "verify" runs the unit tests again; they take seconds.
      - name: 3-4. Integration tests and quality gate
        run: mvn -B -ntp verify

      # 5. The application itself
      - name: 5. Package
        run: mvn -B -ntp -DskipTests package

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          if-no-files-found: ignore

      - name: Upload the application jar
        uses: actions/upload-artifact@v4
        with:
          name: flagship-backend-jar
          path: backend/target/flagship-backend.jar

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t flagship-backend:ci backend

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build
